name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # ffmpeg is used by the analysis tests; mpv is optional (tests skip when it is missing).
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test -- --test-threads=1

      # The ignored tests bind 0.0.0.0 (all interfaces), which prompts the macOS firewall but is
      # fine on Linux runners. test_discover_devices_real is skipped: it only prints whatever a
      # 3 s SSDP multicast scan finds (it asserts nothing) and a hosted runner has no renderers.
      - name: Test (ignored, all interfaces)
        if: runner.os == 'Linux'
        run: cargo test -- --test-threads=1 --ignored --skip test_discover_devices_real
