[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quickstream"
version = "0.1.0"
description = "A terminal audio player and DLNA/UPnP network streamer with interactive playback controls."
authors = [{ name = "Quickstream Developers" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["dlna", "upnp", "audio-streaming", "curses", "tui", "music-player"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Environment :: Console :: Curses",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
quickstream = "quickstream.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quickstream*"]
