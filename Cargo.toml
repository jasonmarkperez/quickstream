[package]
name = "quickstream"
version = "0.2.0"
edition = "2021"
authors = ["Quickstream Contributors"]
description = "A lightweight terminal music player and DLNA network streamer in Rust"
license = "MIT"

[dependencies]
# Audio Metadata Extraction (modeled on mpv-music)
lofty = "0.25"

# Directory Traversal & Indexing (modeled on mpv-music)
walkdir = "2.5"

# Terminal UI & Event Handling
ratatui = "0.29"
crossterm = "0.28"

# Interactive Fuzzy Finding & Live Previews (modeled on mpv-music)
skim = "0.10"

# CLI Parsing (modeled on mpv-music)
clap = { version = "4.5", features = ["derive"] }

# Serialization & Configuration Persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Standard XDG Directory Resolution
directories = "6.0"

# Error Handling & Utilities
anyhow = "1.0"
thiserror = "2.0"
ctrlc = "3.4"
chrono = "0.4"
libc = "0.2"
