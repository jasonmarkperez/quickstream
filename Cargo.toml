[package]
name = "quickstream"
version = "0.3.0"
edition = "2021"
# Minimum toolchain for the locked dependency set (lofty 0.25.4 requires 1.89).
rust-version = "1.89"
authors = ["Jason Perez"]
description = "A lightweight terminal music player and DLNA network streamer in Rust"
license = "MIT"
repository = "https://github.com/jasonmarkperez/quickstream"
readme = "README.md"
keywords = ["music-player", "dlna", "upnp", "tui", "audio"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
# Audio Metadata Extraction (modeled on mpv-music)
lofty = "0.25"

# Directory Traversal & Indexing (modeled on mpv-music)
walkdir = "2.5"

# Terminal UI & Event Handling
ratatui = "0.29"
crossterm = "0.28"

# In-app fuzzy search (`f` modal)
fuzzy-matcher = "0.3"

# CLI Parsing (modeled on mpv-music)
clap = { version = "4.5", features = ["derive"] }

# Serialization & Configuration Persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Standard XDG Directory Resolution
directories = "6.0"

# Local Embedded Track Analysis & Feature Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Lightweight HTTP client for optional online metadata enrichment
ureq = { version = "2.10", features = ["json"] }

# Error Handling & Utilities
anyhow = "1.0"
ctrlc = { version = "3.4", features = ["termination"] }
chrono = "0.4"
libc = "0.2"
